spring.application.name=customer-service

# Make sure server.port etc are configured as you like
server.port=8080

# ========== Resilience4j CircuitBreaker config (property style) ==========
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s

# Instance mapping (name used in @CircuitBreaker)
resilience4j.circuitbreaker.instances.customerCB.baseConfig=default

# ========== Actuator config ==========
# Expose only required endpoints (in dev). Use * cautiously in prod.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# optional - change log dir (Log4j2 xml already defines logs/)
# logging.file.name=logs/customer-service.log (not required when using log4j2.xml)

# Optional: increase logging for debugging
logging.level.io.github.resilience4j=DEBUG
logging.level.io.github.resilience4j.circuitbreaker=DEBUG


